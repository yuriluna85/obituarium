name: Publicação e Indexação Automática de Homenagens

on:
  push:
    paths:
      - 'materias/**.md'
      - 'scripts/indexador_obituario_github.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Indexador de Homenagens
        run: |
          python scripts/indexador_obituario_github.py

      - name: Commitar e Publicar Alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos índices de dados."
          else
            git commit -m "chore: indexação automática de homenagens [skip ci]"
            git push
          fi
