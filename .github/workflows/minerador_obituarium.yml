name: Minerador Autônomo Obituarium

on:
  schedule:
    # Executa a cada 12 horas (às 00:00 e 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Executar Mineração de Notas de Pesar
        run: |
          python auto_minerador_obituario.py

      - name: Commit e Push das Atualizações de Dados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualizacao automatica da base de notas de pesar [skip ci]" && git push origin main)
